<div class="page-header">

  <h1>Allocations</h1>

  <button
    mat-raised-button
    color="primary"
    routerLink="/allocations/add">

    <mat-icon>add</mat-icon>
    Assign Employee

  </button>

</div>

<div class="filters">

  <select
    [(ngModel)]="status"
    (change)="filter()">

    <option [ngValue]="null">
      All Status
    </option>

    <option [ngValue]="true">
      Active
    </option>

    <option [ngValue]="false">
      Inactive
    </option>

  </select>

</div>

<mat-card>

  <table
    mat-table
    [dataSource]="allocations()">

    <ng-container matColumnDef="employee">
      <th mat-header-cell *matHeaderCellDef>
        Employee
      </th>

      <td mat-cell *matCellDef="let a">
        {{a.employeeName}}
      </td>
    </ng-container>

    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef>
        Department
      </th>

      <td mat-cell *matCellDef="let a">
        {{a.departmentName}}
      </td>
    </ng-container>

    <ng-container matColumnDef="project">
      <th mat-header-cell *matHeaderCellDef>
        Project
      </th>

      <td mat-cell *matCellDef="let a">
        {{a.projectName}}
      </td>
    </ng-container>

    <ng-container matColumnDef="assignedOn">
      <th mat-header-cell *matHeaderCellDef>
        Assigned
      </th>

      <td mat-cell *matCellDef="let a">
        {{a.assignedOn | date:'dd-MM-yyyy'}}
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>
        Status
      </th>

      <td mat-cell *matCellDef="let a">

        <mat-chip
          [class]="
            a.status
              ? 'active-chip'
              : 'inactive-chip'
          ">

          {{a.status ? 'Active' : 'Inactive'}}

        </mat-chip>

      </td>
    </ng-container>

    <ng-container matColumnDef="actions">

      <th mat-header-cell *matHeaderCellDef>
        Actions
      </th>

      <td mat-cell *matCellDef="let a">

        <button
          mat-icon-button
          color="primary"
          matTooltip="Edit Allocation"
          [routerLink]="[
            '/allocations/edit',
            a.allocationId
          ]">

          <mat-icon>edit</mat-icon>

        </button>

        <button
          mat-icon-button
          color="warn"
          matTooltip="Remove Allocation"
          (click)="delete(a.allocationId)">

          <mat-icon>delete</mat-icon>

        </button>

      </td>

    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="columns">
    </tr>

    <tr
      mat-row
      *matRowDef="
        let row;
        columns: columns
      ">
    </tr>

  </table>

</mat-card>

<div class="pagination">

  <button
    mat-raised-button
    (click)="prevPage()">

    Previous

  </button>

  <span>

    Page {{pageNumber}}

  </span>

  <button
    mat-raised-button
    (click)="nextPage()">

    Next

  </button>

  <span>

    Total:
    {{totalCount}}

  </span>

</div>
