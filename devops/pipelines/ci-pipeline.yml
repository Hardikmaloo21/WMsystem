trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 9.x
  - script: dotnet restore WMS.sln
    displayName: Restore backend
  - script: dotnet build WMS.sln --configuration Release --no-restore
    displayName: Build backend
  - script: dotnet test WMS.sln --configuration Release --no-build
    displayName: Test backend
  - script: npm ci && npm run build
    workingDirectory: frontend/wms-frontend
    displayName: Build frontend
